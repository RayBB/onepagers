repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # Ruff version.
  rev: v0.15.8
  hooks:
    # Run the linter.
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
- repo: https://github.com/astral-sh/ty-pre-commit
  # ty version.
  rev: v0.0.49
  hooks:
    - id: ty
      args: [--project, sites/urbanism-now-links]
